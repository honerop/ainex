name: Native Nix build and browser tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build and test Ainex
        run: nix build . --show-trace --print-build-logs
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 xdotool
      - name: Smoke-test asynchronous Ain GUI
        run: |
          set -eu
          output=$(timeout 15s xvfb-run -a dbus-run-session ./result/libexec/ainex-tests/gui-task)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -x 'tick'
          printf '%s\n' "$output" | grep -x '42'
      - name: Smoke-launch native GTK4 window
        run: |
          set +e
          timeout 10s xvfb-run -a dbus-run-session ./result/bin/ainex > /tmp/ainex-smoke.log 2>&1
          code=$?
          cat /tmp/ainex-smoke.log
          if [ "$code" -ne 124 ]; then
            echo "Ainex should remain running with its GTK window until timeout; exited with $code"
            exit 1
          fi
      - name: Check Vim mode typing in native GTK4 composer
        run: |
          set -eu
          timeout 20s xvfb-run -a dbus-run-session bash -c '
            set -eu
            ./result/libexec/ainex-tests/gui-keys > /tmp/ainex-gui-keys.log &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            window=""
            for i in $(seq 1 60); do
              window=$(xdotool search --name "Ainex keyboard test" 2>/dev/null | head -n 1 || true)
              if [ -n "$window" ]; then break; fi
              sleep 0.1
            done
            test -n "$window"
            xdotool windowfocus --sync "$window"
            xdotool type --clearmodifiers --delay 60 "kick"
            xdotool key Escape
            xdotool key k
            xdotool key i
            xdotool type --clearmodifiers --delay 60 "jog"
            xdotool key Return
            wait "$pid"
          '
          cat /tmp/ainex-gui-keys.log
          grep -x "send" /tmp/ainex-gui-keys.log
          grep -x "kickjog" /tmp/ainex-gui-keys.log
